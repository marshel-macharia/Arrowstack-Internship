# WA-06: track clients by IP, allow 5 requests/minute
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

server {
    listen 127.0.0.1:8080;
    server_name localhost;

    # Pass-through settings (inherited by every location below)
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # WA-03: drop the app's weak headers, add hardened ones
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Feature-Policy;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # WA-08: block /ftp (case-insensitive, because Express treats /FTP the same)
    location ~* ^/ftp {
        return 403;
    }

    # WA-06: rate-limit the login endpoint (also case-insensitive)
    location ~* ^/rest/user/login/?$ {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
